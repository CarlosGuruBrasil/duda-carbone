<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="ballGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4f54a"/>
      <stop offset="55%" stop-color="#b8e832"/>
      <stop offset="100%" stop-color="#8ab520"/>
    </radialGradient>
    <radialGradient id="shineGrad" cx="35%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ball body -->
  <circle cx="16" cy="16" r="14" fill="url(#ballGrad)" filter="url(#shadow)"/>

  <!-- Seam left curve -->
  <path
    d="M 8.5 5.5 C 4 10, 4 22, 8.5 26.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Seam right curve -->
  <path
    d="M 23.5 5.5 C 28 10, 28 22, 23.5 26.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Shine -->
  <circle cx="16" cy="16" r="14" fill="url(#shineGrad)"/>
</svg>
